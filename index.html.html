<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tomic-secure-web</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f0f2f5;
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        color: #333;
      }

      .spinner {
        border: 6px solid #e0e0e0;
        border-top: 6px solid #4caf50;
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        margin-bottom: 15px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .text {
        font-size: 1.2rem;
        font-weight: 500;
      }

      .notice {
        margin-top: 10px;
        font-size: 0.9rem;
        color: #777;
      }
    </style>
  </head>

  <body>
    <div class="spinner"></div>
    <div class="text">Pending...</div>
    <div class="notice">Hosting not yet activated. Please complete payment to continue.</div>
  </body>
</html>
